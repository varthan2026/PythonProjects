<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BPS Election Management System</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body data-role="{{ role }}">

<header class="topbar">

<div class="left">

<button id="menuBtn">
<i class="fa-solid fa-bars"></i>
</button>

<h2>BPS Election Management System</h2>

</div>

<div class="right">

<span id="clock">00:00:00</span>

<button id="fullscreenBtn">
<i class="fa-solid fa-expand"></i>
</button>

<button id="logoutBtn">
Logout
</button>

</div>

</header>

<div class="wrapper">

<nav class="sidebar" id="sidebar">

<button class="active" onclick="showPage('dashboard')">
<i class="fa-solid fa-house"></i>
<span>Home</span>
</button>

<button id="registrationMenu"
onclick="showPage('registration')">
    <i class="fa-solid fa-address-card"></i>
    <span>Registration</span>
</button>

<button onclick="showPage('students')">
    <i class="fa-solid fa-users"></i>
    <span>Students</span>
</button>

<button onclick="showPage('candidates')">
    <i class="fa-solid fa-user-tie"></i>
    <span>Candidates</span>
</button>

<button id="electionMenu"
onclick="showPage('election')">
    <i class="fa-solid fa-check-to-slot"></i>
    <span>Election Control</span>
</button>

<button>
<i class="fa-solid fa-chart-column"></i>
<span>Results</span>
</button>

<button>
<i class="fa-solid fa-clock-rotate-left"></i>
<span>Login Records</span>
</button>

<button id="settingsMenu"
onclick="showPage('settings')">

<i class="fa-solid fa-gear"></i>
<span>Settings</span>

</button>

</nav>

<main class="content">

<div id="content-area">

    <h1>Dashboard</h1>

    <div class="cards">

    <div class="card">
        <h3>Total Students</h3>
        <h1 id="totalStudents">0</h1>
    </div>

    <div class="card">
        <h3>Total Candidates</h3>
        <h1 id="totalCandidates">0</h1>
    </div>

    <div class="card">
        <h3>Votes Cast</h3>
        <h1 id="totalVotes">0</h1>
    </div>

    <div class="card">
        <h3>Election Status</h3>
        <h1 id="electionStatus">Not Started</h1>
    </div>

</div>

<div class="activity">

    <h2>Statistics</h2>

    <br>

    <p><b>Present Students :</b>
    <span id="presentStudents">0</span></p>

    <br>

    <p><b>Absent Students :</b>
    <span id="absentStudents">0</span></p>

</div>

</div>

</main>

</div>
loadDashboard();

<!-- Custom Popup -->

<!-- Universal Popup -->

<div id="popup" class="popup">

    <div class="popup-box">

        <h2 id="popupTitle">Title</h2>

        <p id="popupMessage"></p>

        <div class="popup-buttons">

            <button id="popupOkBtn">
                OK
            </button>

            <button id="popupCancelBtn" style="display:none;">
                Cancel
            </button>

        </div>

    </div>

</div>
<script>

window.userRole = "{{ role }}";

</script>

<script src="{{ url_for('static',
filename='js/script.js') }}">
</script>

<script>

window.onload = function(){

    if(role=="Election Officer"){

        document.getElementById("settingsMenu").style.display="none";

    }

    if(role=="Viewer"){

        document.getElementById("settingsMenu").style.display="none";

        document.getElementById("registrationMenu").style.display="none";

        document.getElementById("electionMenu").style.display="none";

    }

}



</script>

</body>

</html>
